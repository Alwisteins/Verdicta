name: Sync Backend to Hugging Face Space

on:
  push:
    branches:
      - master
    paths:
      - "rag-agent/**"
      - ".github/workflows/sync-backend-hf.yml"
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push RAG Agent Subfolder to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Konfigurasi Git Identity untuk Runner
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # 2. Ekstrak subfolder rag-agent ke temporary branch agar struktur root sesuai di HF
          git subtree split --prefix=rag-agent -b hf-deploy-branch

          # 3. Push langsung ke repository Hugging Face Space
          git push https://Alwisteins:$HF_TOKEN@huggingface.co/spaces/Alwisteins/verdicta-backend hf-deploy-branch:main --force
