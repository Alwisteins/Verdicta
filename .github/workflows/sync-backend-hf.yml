name: Sync Backend to Hugging Face Space

on:
  push:
    branches:
      - master
    paths:
      - "rag-agent/**"
      - ".github/workflows/sync-backend-hf.yml"
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Push Clean Snapshot to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Pindah ke folder rag-agent
          cd rag-agent

          # 2. Inisialisasi repositori git sementara di dalam folder rag-agent
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # 3. Stage semua file yang ADA SEKARANG (tanpa membawa histori commit lama)
          git add .
          git commit -m "Deploy clean backend snapshot from master"

          # 4. Push paksa snapshot bersih ini ke Hugging Face Space
          git push https://Alwisteins:$HF_TOKEN@huggingface.co/spaces/Alwisteins/verdicta-backend HEAD:main --force
